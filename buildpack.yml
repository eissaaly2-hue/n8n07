---
nodejs:
  version: 22.22.0
build:
  install:
    - corepack enable
    - corepack prepare pnpm@10.22.0 --activate
    - pnpm install --no-frozen-lockfile
  build:
    - pnpm run build --filter=!n8n-nodes-base
  start:
    - pnpm start
port: 5678
environment:
  NODE_VERSION: 22.22.0
  PNPM_VERSION: 10.22.0
  COREPACK_ENABLE_NODE_VERSION_CHECK: "0"
